name: Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-linux-qt6:
    name: Build with Qt6 (Ubuntu)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Check version consistency
      run: |
        cmake_ver=$(sed -n 's/^project(bectl_gui VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
        port_ver=$(sed -n 's/^DISTVERSION=[[:space:]]*//p' freebsd/Makefile)
        pro_ver=$(grep 'BECTL_GUI_VERSION' bectl_gui.pro | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
        echo "CMakeLists.txt: $cmake_ver / freebsd/Makefile: $port_ver / bectl_gui.pro: $pro_ver"
        test -n "$cmake_ver" && test "$cmake_ver" = "$port_ver" && test "$cmake_ver" = "$pro_ver"
        grep -q "^## \[$cmake_ver\]" CHANGELOG.md

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build clang qt6-base-dev qt6-tools-dev libgl1-mesa-dev

    - name: Configure CMake
      run: |
        cmake -B build -S . -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DBECTL_GUI_BUILD_TESTS=ON

    - name: Build with CMake
      run: |
        cmake --build build --verbose

    # tst_validation roda aqui; tst_bectlmanager precisa do bectl(8) e é
    # ignorado fora dos jobs FreeBSD.
    - name: Run tests
      run: |
        ctest --test-dir build --output-on-failure

    # Os mesmos testes com AddressSanitizer e UBSan: erros de memória,
    # vazamentos e comportamento indefinido reprovam o job.
    - name: Run tests with ASan + UBSan
      env:
        ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      run: |
        cmake -B build-asan -S . -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DBECTL_GUI_BUILD_TESTS=ON \
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
        cmake --build build-asan
        ctest --test-dir build-asan --output-on-failure

    - name: Test QMake build
      run: |
        mkdir -p build-qmake
        cd build-qmake
        qmake6 ../bectl_gui.pro
        make -j$(nproc)

  # Arquiteturas Tier 1 do FreeBSD (amd64 e aarch64) nas releases mais novas
  # das séries suportadas. Cada job compila com o Clang do sistema e os
  # pacotes Qt6, executa tests/freebsd-e2e.sh contra o bectl(8) real e
  # valida o port com o framework de ports (veja ci/freebsd-ci.sh,
  # ci/freebsd-port.sh e docs/ARCHITECTURES.md).
  freebsd:
    name: FreeBSD ${{ matrix.release }} / ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { release: "14.5", arch: "",        label: "amd64" }
          - { release: "14.5", arch: "aarch64", label: "aarch64" }
          - { release: "15.1", arch: "",        label: "amd64" }
          - { release: "15.1", arch: "aarch64", label: "aarch64" }

    steps:
    - uses: actions/checkout@v5

    # aarch64 roda emulado no runner x86_64, como a action recomenda.
    - name: Build and test
      uses: vmactions/freebsd-vm@v1
      with:
        release: ${{ matrix.release }}
        arch: ${{ matrix.arch }}
        run: sh ci/freebsd-ci.sh && sh ci/freebsd-port.sh
